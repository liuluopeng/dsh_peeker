# lx_dsh_peek bundle patch: host-only, serves its own LAN page.
# The row name must match package.json's name so the Loader resolves the package.
- insert:
    - id: lx-dsh-peek
      name: lx_dsh_peek
      config:
        port: 3082
        # 'fill' uses the whole conversation pane. A number (640–2400) caps the
        # transcript/composer; 0 restores the official width and drag handles.
        contentWidth: fill
        # Official DSH caps its Settings font at 22px; this style override is
        # what actually sets the rendered size. Change these, not the Settings row.
        fontSize: 34
        codeFontSize: 24
        terminalFontSize: 24
        # Taller official input box in px; 0 keeps the official height. The
        # scroll area starts scrolling after composerHeight + 160px.
        composerHeight: 200
        # Official Think rows never open by themselves and the collapsed body is
        # not even mounted, so the client face opens them: 'all' opens every
        # reasoning row (history too), 'stream' opens only the row producing
        # tokens, 'off' keeps the official behavior.
        expandReasoning: all
        # Terminal tabs are Session-scoped, so a new Session has none. 'open'
        # gives the on-screen Session a terminal tab when it has none, 'reveal'
        # also expands the collapsed right column, 'off' leaves the UI alone.
        autoTerminal: open
        # ── 会话归档（2026-11-19）：把每个会话的完整事件流镜像到 NAS 的 PG ──
        # 默认开启；没有凭证时只留在内存、在 /api/archive/status 标记 no-token。
        archive:
          enabled: true
          # NAS 地址：LAN 内直连（Caddy 自签证书，insecureTls 默认接受）
          apiBase: http://192.168.31.58:23000
          # 凭证二选一：粘贴登录 JWT（30 天），或给账号让它自动续期
          token: ''
          # username: dsh_archive
          # passwordFile: ~/.dsh/lx-dsh-peek-archive/password
          # 每批事件数 / 投递间隔（毫秒）
          batch: 200
          flushMs: 3000
          # 会话列表轮询间隔（发现新会话/需回填的历史会话）
          pollMs: 30000
          # 首次启动回填全部历史会话（~/.dsh/sessions 里的存量）
          backfill: true
          # 归档模式：text（默认，只存对话文本：用户提问 + 助手正文/思考）| full（完整事件流）
          mode: text
          # 同时归档 ZCode 会话的对话文本（读 ~/.zcode/cli/db/db.sqlite，只读）
          zcode: true
          # 仅 full 模式有意义：是否连 assistant/message.stream（逐 token 副本）一起存
          storeStream: false
