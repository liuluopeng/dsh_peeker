# lx_dsh_peek bundle patch: host-only, serves its own LAN page.
# The row name must match package.json's name so the Loader resolves the package.
- insert:
    - id: lx-dsh-peek
      name: lx_dsh_peek
      config:
        port: 3082
        # 'fill' uses the whole conversation pane. A number (640–2400) caps the
        # transcript/composer; 0 restores the official width and drag handles.
        contentWidth: fill
        # Official DSH caps its Settings font at 22px; this style override is
        # what actually sets the rendered size. Change these, not the Settings row.
        fontSize: 34
        codeFontSize: 24
        terminalFontSize: 24
        # Taller official input box in px; 0 keeps the official height. The
        # scroll area starts scrolling after composerHeight + 160px.
        composerHeight: 200
