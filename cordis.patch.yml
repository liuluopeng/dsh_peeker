# lx_dsh_peek bundle patch: host-only, serves its own LAN page.
# The row name must match package.json's name so the Loader resolves the package.
- insert:
    - id: lx-dsh-peek
      name: lx_dsh_peek
      config:
        port: 3082
        # Conversation column width in px (0 = official adaptive width and
        # drag handles). A nonzero value pins the transcript and composer.
        contentWidth: 1200
        # Official DSH caps its Settings font at 22px; this style override is
        # what actually sets the rendered size. Change these, not the Settings row.
        fontSize: 34
        codeFontSize: 24
        terminalFontSize: 24
